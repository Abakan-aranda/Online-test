<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн-тест: Гласные и согласные (орфография)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #f5f9ff 0%, #e6f0fa 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .test-container {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 42px;
            box-shadow: 0 25px 50px -10px rgba(0, 30, 60, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            padding: 40px 36px;
            transition: all 0.2s;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #0b2e4b;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        h1 span {
            background: #1e6f9f;
            color: white;
            font-size: 1.2rem;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 500;
        }

        .subhead {
            color: #4a6582;
            font-size: 1.05rem;
            margin-bottom: 30px;
            border-left: 4px solid #7fb4d9;
            padding-left: 18px;
            font-weight: 400;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #eef4fb;
            border-radius: 60px;
            padding: 10px 24px;
            margin-bottom: 28px;
            font-weight: 500;
            color: #1c4e72;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .progress {
            background: #d0e2f0;
            height: 8px;
            border-radius: 20px;
            flex: 1;
            min-width: 150px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #1e6f9f;
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        .question-area {
            margin-bottom: 28px;
        }

        .question-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .question-number {
            font-weight: 600;
            color: #1e6f9f;
            background: #e1f0fe;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: #0b2e4b;
            line-height: 1.4;
            margin: 12px 0 20px;
            padding: 8px 0;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        .option {
            display: flex;
            align-items: center;
            background: #f9fcff;
            border: 2px solid #cfddee;
            border-radius: 60px;
            padding: 14px 24px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 1.15rem;
            font-weight: 500;
            color: #153e5c;
        }

        .option:hover:not(.locked) {
            background: #e1efff;
            border-color: #7aa9d4;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(30, 111, 159, 0.12);
        }

        .option.selected {
            background: #d4e7fe;
            border-color: #1e6f9f;
            box-shadow: 0 0 0 3px rgba(30, 111, 159, 0.15);
        }

        .option.correct {
            background: #d9f0e3;
            border-color: #2c9b5e;
            color: #185c38;
        }

        .option.wrong {
            background: #ffe2de;
            border-color: #d94f4f;
            color: #a13030;
        }

        .option.locked {
            cursor: default;
            opacity: 0.9;
        }

        .option input {
            display: none;
        }

        .option-indicator {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #a3bedb;
            margin-right: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: white;
            transition: 0.1s;
        }

        .option.selected .option-indicator {
            border-color: #1e6f9f;
            background: #1e6f9f;
            box-shadow: inset 0 0 0 5px white;
        }

        .option.correct .option-indicator {
            border-color: #2c9b5e;
            background: #2c9b5e;
            box-shadow: inset 0 0 0 5px white;
        }

        .option.wrong .option-indicator {
            border-color: #d94f4f;
            background: #d94f4f;
            box-shadow: inset 0 0 0 5px white;
        }

        .feedback {
            padding: 16px 22px;
            border-radius: 24px;
            background: #f0f7fe;
            border-left: 6px solid #1e6f9f;
            margin: 20px 0 10px;
            font-size: 1.05rem;
            color: #174364;
            display: none;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }

        .feedback.show {
            display: flex;
        }

        .feedback .icon {
            font-size: 1.6rem;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 18px;
            align-items: center;
        }

        .btn {
            border: none;
            border-radius: 80px;
            padding: 14px 32px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid transparent;
            flex: 0 1 auto;
        }

        .btn-primary {
            background: #1e6f9f;
            color: white;
            box-shadow: 0 8px 18px -6px rgba(30, 111, 159, 0.4);
        }

            background: #155b83;
            transform: translateY(-2px);
            box-shadow: 0 12px 22px -8
