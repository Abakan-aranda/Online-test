<html lang="ru">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #f5f9ff 0%, #e6f0fa 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .test-container {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 42px;
            box-shadow: 0 25px 50px -10px rgba(0, 30, 60, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            padding: 40px 36px;
            transition: all 0.2s;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #0b2e4b;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        h1 span {
            background: #1e6f9f;
            color: white;
            font-size: 1.2rem;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 500;
        }

        .subhead {
            color: #4a6582;
            font-size: 1.05rem;
            margin-bottom: 30px;
            border-left: 4px solid #7fb4d9;
            padding-left: 18px;
            font-weight: 400;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #eef4fb;
            border-radius: 60px;
            padding: 10px 24px;
            margin-bottom: 28px;
            font-weight: 500;
            color: #1c4e72;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .progress {
            background: #d0e2f0;
            height: 8px;
            border-radius: 20px;
            flex: 1;
            min-width: 150px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #1e6f9f;
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        .question-area {
            margin-bottom: 28px;
        }

        .question-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .question-number {
            font-weight: 600;
            color: #1e6f9f;
            background: #e1f0fe;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: #0b2e4b;
            line-height: 1.4;
            margin: 12px 0 20px;
            padding: 8px 0;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        .option {
            display: flex;
            align-items: center;
            background: #f9fcff;
            border: 2px solid #cfddee;
            border-radius: 60px;
            padding: 14px 24px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 1.15rem;
            font-weight: 500;
            color: #153e5c;
        }

        .option:hover:not(.locked) {
            background: #e1efff;
            border-color: #7aa9d4;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(30, 111, 159, 0.12);
        }

        .option.selected {
            background: #d4e7fe;
            border-color: #1e6f9f;
            box-shadow: 0 0 0 3px rgba(30, 111, 159, 0.15);
        }

        .option.correct {
            background: #d9f0e3;
            border-color: #2c9b5e;
            color: #185c38;
        }

        .option.wrong {
            background: #ffe2de;
            border-color: #d94f4f;
            color: #a13030;
        }

        .option.locked {
            cursor: default;
            opacity: 0.9;
        }

        .option input {
            display: none;
        }

        .option-indicator {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #a3bedb;
            margin-right: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: white;
            transition: 0.1s;
        }

        .option.selected .option-indicator {
            border-color: #1e6f9f;
            background: #1e6f9f;
            box-shadow: inset 0 0 0 5px white;
        }

        .option.correct .option-indicator {
            border-color: #2c9b5e;
            background: #2c9b5e;
            box-shadow: inset 0 0 0 5px white;
        }

        .option.wrong .option-indicator {
            border-color: #d94f4f;
            background: #d94f4f;
            box-shadow: inset 0 0 0 5px white;
        }

            padding: 16px 22px;
            border-radius: 24px;
            background: #f0f7fe;
            border-left: 6px solid #1e6f9f;
            margin: 20px 0 10px;
            font-size: 1.05rem;
            color: #174364;
            display: none;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }

        .feedback.show {
            display: flex;
        }

        .feedback .icon {
            font-size: 1.6rem;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 18px;
            align-items: center;
        }

        .btn {
            border: none;
            border-radius: 80px;
            padding: 14px 32px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid transparent;
            flex: 0 1 auto;

        .btn-primary {
            background: #1e6f9f;
            color: white;
            box-shadow: 0 8px 18px -6px rgba(30, 111, 159, 0.4);
        }

        .btn-primary:hover:not(:disabled) {
            background: #155b83;
            transform: translateY(-2px);
            box-shadow: 0 12px 22px -8px rgba(30, 111, 159, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-secondary {
            background: white;
            color: #1e6f9f;
            border: 1.5px solid #b9d2ea;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e7f2fd;
            border-color: #1e6f9f;
        }

        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .result-message {
            text-align: center;
            padding: 24px 16px;
            background: #e3f0fa;
            border-radius: 34px;
            margin-top: 28px;
            display: none;
            font-size: 1.3rem;
            font-weight: 600;
            color: #0b2e4b;
        }

        .result-message.show {
            display: block;
            animation: fade 0.3s;
        }

        @keyframes fade {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .score-badge {
            background: #1e6f9f;
            color: white;
            padding: 8px 22px;
            border-radius: 50px;
            font-size: 1.1rem;
            display: inline-block;
            margin-top: 12px;
        }

        .restart-link {
            background: none;
            border: none;
            color: #1e6f9f;
            text-decoration: underline;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.95rem;
            margin-left: 8px;
        }

        .footer-note {
            text-align: center;
            font-size: 0.85rem;
            color: #7b94ab;
            margin-top: 24px;
        }
    </style>

            const feedbackIcon = document.getElementById('feedbackIcon');
            const feedbackText = document.getElementById('feedbackText');
            const progressFill = document.getElementById('progressFill');
            const currentQuestionDisplay = document.getElementById('currentQuestionDisplay');
            const correctCountDisplay = document.getElementById('correctCountDisplay');
            const resultMessage = document.getElementById('resultMessage');
            const finalScoreText = document.getElementById('finalScoreText');

            // ---------- ФУНКЦИИ ----------
            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            // Перемешиваем вопросы и варианты? Нет, оставим порядок, но можно перемешать,
            // но для обучения лучше фиксированный порядок. Оставим как есть.

            // Обновление прогресса
            function updateProgress() {
                const total = QUESTIONS_DATA.length;
                const answeredCount = userAnswers.filter((ans, idx) => ans !== null && answerStatus[idx] !== undefined).length;
                // Прогресс-бар: количество проверенных вопросов (checkedCurrent или answerStatus не false)
                let completed = 0;
                for (let i = 0; i < total; i++) {
                    if (userAnswers[i] !== null && (i !== currentIndex || checkedCurrent)) {
                        completed++;
                    }
                }
                // Для прогресса считаем: сколько вопросов уже проверено (answerStatus[i] !== undefined)
                const checkedCount = answerStatus.filter((val, idx) => userAnswers[idx] !== null && (idx !== currentIndex || checkedCurrent)).length;
                const percent = (checkedCount / total) * 100;
                progressFill.style.width = percent + '%';
                currentQuestionDisplay.textContent = currentIndex + 1;
                correctCountDisplay.textContent = correctCount;
            }

            // Отобразить вопрос
            function renderQuestion() {
                const q = QUESTIONS_DATA[currentIndex];
                questionNumberBadge.textContent = `Вопрос ${currentIndex + 1}`;
                questionText.textContent = q.text;

                // Отрисовка опций
                optionsContainer.innerHTML = '';
                q.options.forEach((opt, idx) => {
                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'option';
                    if (userAnswers[currentIndex] === idx) {
                        optionDiv.classList.add('selected');
                    }
                    // Если вопрос уже проверен, блокируем и показываем правильность
                    if (checkedCurrent) {
                        optionDiv.classList.add('locked');
                        if (idx === q.correct) {
                            optionDiv.classList.add('correct');
                        } else if (userAnswers[currentIndex] === idx && userAnswers[currentIndex] !== q.correct) {
                            optionDiv.classList.add('wrong');
                        }
                    }

                    optionDiv.innerHTML = `
                        <span class="option-indicator"></span>
                        <span>${opt}</span>
                    `;

                    // Обработчик клика (только если не проверен)
                    optionDiv.addEventListener('click', () => {
                        if (checkedCurrent) return;
                        // Снимаем выделение со всех
                        document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
                        optionDiv.classList.add('selected');
                        userAnswers[currentIndex] = idx;
                        // Активируем кнопку "Проверить"
                        checkBtn.disabled = false;
                    });

                    optionsContainer.appendChild(optionDiv);
                });

                // Настройка кнопок
                if (checkedCurrent) {
                    checkBtn.disabled = true;
                    nextBtn.disabled = false; // можно идти дальше
                } else {
                    checkBtn.disabled = userAnswers[currentIndex] === null;
                    nextBtn.disabled = true;
                }

                // Обратная связь: если проверен, показываем пояснение
                if (checkedCurrent) {
                    const isCorrect = answerStatus[currentIndex];
                    feedbackMessage.classList.add('show');
                    if (isCorrect) {
                        feedbackIcon.textContent = '✅';
                        feedbackText.textContent = q.explanation;
                    } else {
                        feedbackIcon.textContent = '❌';
                        feedbackText.textContent = `Неверно. ${q.explanation}`;
                    }
                } else {
                    feedbackMessage.classList.remove('show');
                }

                // Если текущий вопрос последний и проверен, меняем текст кнопки Next?
                // Оставим "Далее", но при клике на последнем покажем результат.
                if (currentIndex === QUESTIONS_DATA.length - 1) {
                    nextBtn.textContent = '🏁 Завершить';
                } else {
                    nextBtn.textContent = '➡️ Далее';
                }

                updateProgress();
            }

            // Проверка текущего ответа
            function checkAnswer() {
                if (checkedCurrent) return;
                const selectedIdx = userAnswers[currentIndex];
                if (selectedIdx === null) return;

                const q = QUESTIONS_DATA[currentIndex];
                const isCorrect = (selectedIdx === q.correct);

                // Сохраняем статус
                answerStatus[currentIndex] = isCorrect;
                if (isCorrect) {
                    correctCount++;
                }

                checkedCurrent = true;

                // Перерисовываем, чтобы показать правильные/неправильные
                renderQuestion();

                // Обновляем прогресс и счетчик
                updateProgress();
                correctCountDisplay.textContent = correctCount;

                // Блокируем кнопку проверки
                checkBtn.disabled = true;
                // Разблокируем next
                nextBtn.disabled = false;

                // Показываем пояснение (уже в renderQuestion)
            }

            // Переход к следующему вопросу
            function goToNext() {
                // Если текущий вопрос ещё не проверен, но пользователь как-то нажал next?
                // Кнопка next активна только после проверки, так что всё ок.
                if (currentIndex < QUESTIONS_DATA.length - 1) {
                    currentIndex++;
                    checkedCurrent = false;
                    // Сбрасываем выделение для нового вопроса? userAnswers уже сохранён
                    renderQuestion();
                    // Прокрутка вверх
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    // Последний вопрос - показываем результат
                    showResult();
                }
            }

            // Показать итоговый результат
            function showResult() {
                // Скрываем область вопроса и кнопки? Оставим, но покажем сообщение
                const total = QUESTIONS_DATA.length;
                const score = correctCount;
                finalScoreText.textContent = `${score} из ${total} правильных ответов.`;
                resultMessage.classList.add('show');
                // Скрываем кнопки проверки/далее? Оставим, но заблокируем
                checkBtn.disabled = true;
                nextBtn.disabled = true;
                // Прокрутим к результату
                resultMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            // Сброс и перезапуск теста
            function restartTest() {
                // Сброс состояния
                currentIndex = 0;
                userAnswers = new Array(QUESTIONS_DATA.length).fill(null);
                answerStatus = new Array(QUESTIONS_DATA.length).fill(false);
                checkedCurrent = false;
                correctCount = 0;

                // Сброс интерфейса
                resultMessage.classList.remove('show');
                feedbackMessage.classList.remove('show');
                checkBtn.disabled = true;
                nextBtn.disabled = true;
                nextBtn.textContent = '➡️ Далее';

                // Перерисовка
                renderQuestion();
                updateProgress();
                correctCountDisplay.textContent = '0';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            // ---------- ОБРАБОТЧИКИ ----------
            checkBtn.addEventListener('click', checkAnswer);

            nextBtn.addEventListener('click', goToNext);

            restartBtn.addEventListener('click', restartTest);

            restartFromResult.addEventListener('click', restartTest);

            // Инициализация
            function init() {
                // Перемешаем вопросы? Нет, оставим фиксированный порядок для предсказуемости.
                // Но можно перемешать опции внутри вопроса? Нет, иначе правильный индекс не совпадёт.
                // Оставим как есть.
                renderQuestion();
                updateProgress();
            }

            init();

        })();
    </script>
</body>
</html>
