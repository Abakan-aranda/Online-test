<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр орфографии</title>
<style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --ink: #20263a;
  --muted: #68718a;
  --accent: #5856d6;
  --good: #18794e;
  --bad: #b42318;
  --line: #e4e7f0;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 system-ui, Arial, sans-serif;
}
.wrap { max-width: 780px; margin: auto; padding: 28px 16px; }
header { margin-bottom: 24px; }
.badge {
  display: inline-block;
  padding: 5px 10px;
  border-radius: 20px;
  background: #e9e8ff;
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
}
h1 { font-size: 34px; line-height: 1.15; margin: 14px 0 8px; }
.muted { color: var(--muted); }
.progress-box, .card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 16px;
}
.progress-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
  color: var(--muted);
  font-size: 14px;
}
.track { height: 8px; background: #eceef5; border-radius: 9px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.meta { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
.tag { font-size: 12px; color: var(--muted); font-weight: 700; }
h2 { font-size: 23px; line-height: 1.35; margin: 0 0 22px; }
.options { display: grid; gap: 10px; }
.option {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  border: 1.5px solid var(--line);
  border-radius: 13px;
  padding: 13px;
  background: white;
  color: var(--ink);
  font: inherit;
  cursor: pointer;
}
.option:hover:not(:disabled) { border-color: var(--accent); }
.option:disabled { cursor: default; }
.letter {
  width: 30px;
  height: 30px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  background: #f0f1f7;
  border-radius: 9px;
  font-weight: 800;
}
.option.correct { background: #e8f7ef; border-color: #72c99a; }
.option.wrong { background: #fff0ee; border-color: #f19a91; }
.feedback { display: none; margin-top: 18px; padding: 15px; border-radius: 12px; }
.feedback.show { display: block; }
.feedback.good { background: #e8f7ef; color: #155d3d; }
.feedback.bad { background: #fff0ee; color: #8f2019; }
.feedback strong { display: block; margin-bottom: 5px; }
.hint { margin-top: 16px; }
.hint button { color: var(--accent); border: 0; background: none; padding: 0; font: inherit; cursor: pointer; font-weight: 700; }
.hint p { display: none; color: var(--muted); }
.hint p.show { display: block; }
.actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 24px; }
.btn { border: 0; border-radius: 11px; padding: 12px 17px; font: inherit; font-weight: 750; cursor: pointer; }
.primary { background: var(--accent); color: white; }
.primary:disabled { opacity: .4; cursor: not-allowed; }
.secondary { background: #f0f1f7; color: var(--ink); }
.result { display: none; text-align: center; }
.result.show { display: block; }
.score { font-size: 36px; font-weight: 850; color: var(--accent); margin: 12px; }
.review { text-align: left; display: grid; gap: 10px; margin-top: 25px; }
.review-item { padding: 14px; border: 1px solid var(--line); border-radius: 12px; }
.review-item strong { display: block; margin-bottom: 5px; }
footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 20px; }
@media(max-width:520px) {
  h1 { font-size: 29px; }
  .actions { flex-direction: column-reverse; }
  .actions button { width: 100%; }
  .card, .progress-box { padding: 17px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">ТРЕНАЖЁР · 10 ВОПРОСОВ</span>
    <h1>Орфографияq</h1>
    <p class="muted">Гласные, согласные и сложные правила русского языка. Выбери ответ, прочитай объяснение и закрепи знания. Автор Девяшин Кирилл</p>
  </header>

  <div class="progress-box" id="progressBox">
    <div class="progress-row">
      <span id="progressText">Вопрос 1 из 10</span>
      <span id="answeredText">Отвечено: 0/10</span>
    </div>
    <div class="track"><div class="fill" id="progressFill"></div></div>
  </div>

  <main class="card">
    <section id="quiz">
      <div class="meta">
        <span class="tag" id="topic"></span>
        <span class="tag" id="number"></span>
      </div>
      <h2 id="question"></h2>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="hint">
        <button id="hintButton" type="button">＋ Показать подсказку</button>
        <p id="hintText"></p>
      </div>
      <div class="actions">
        <button class="btn secondary" id="restart" type="button">Начать заново</button>
        <button class="btn primary" id="next" type="button" disabled>Следующий вопрос →</button>
      </div>
    </section>

    <section class="result" id="result" aria-live="polite">
      <span class="badge">ТЕСТ ЗАВЕРШЁН</span>
      <div class="score" id="score"></div>
      <h2 id="resultTitle"></h2>
      <p class="muted" id="resultText"></p>
      <div class="actions">
        <button class="btn primary" id="again" type="button">Пройти ещё раз</button>
      </div>
      <div class="review" id="review"></div>
    </section>
  </main>
  <footer>Все вопросы фиксированы · Результат считается автоматически</footer>
</div>

<script>
const questions = [
  {
    topic: "Безударные гласные",
    q: "В каком ряду в обоих словах пропущена проверяемая безударная гласная корня?",
    opts: [
      "примирять друзей, посвятить стихи",
      "загореть, прикоснуться",
      "скрипеть, удивительный",
      "растение, вырастить"
    ],
    a: 0,
    hint: "Подбери проверочные слова к обеим гласным: «мир» и «свято».",
    why: "«Примирять» проверяется словом «мир», а «посвятить» — словом «свято». В других рядах есть чередующиеся или непроверяемые гласные."
  },
  {
    topic: "Чередующиеся гласные",
    q: "В каком слове на месте пропуска пишется А?",
    opts: ["з…рница", "к…саться", "прик…снуться", "заг…релый"],
    a: 1,
    hint: "Вспомни условие выбора гласной в корне -кас-/-кос-.",
    why: "«Касаться» пишется с а, потому что после корня есть суффикс -а-. «Коснуться», «зарница» и «загорелый» подчиняются другим условиям чередования."
  },
  {
    topic: "Парные согласные",
    q: "В каком слове написание согласной нельзя проверить обычным изменением формы слова?",
    opts: ["просьба", "мороз", "лодка", "гриб"],
    a: 0,
    hint: "Подумай, как соотносятся слова «просьба» и «просить».",
    why: "В слове «просьба» пишется с из слова «просить», хотя перед б звук произносится звонко. «Мороз — морозы», «лодка — лодочка», «гриб — грибы» проверяются."
  },
  {
    topic: "Непроизносимые согласные",
    q: "В каком слове пишется непроизносимая согласная Т?",
    opts: ["чудес…ный", "опас…ный", "мест…ный", "радос…ный"],
    a: 2,
    hint: "Подбери родственное слово, в котором согласная отчётливо слышна.",
    why: "«Местный» — от слова «место», поэтому пишется т. В словах «чудесный», «опасный» и «радостный» непроизносимая т не пишется."
  },
  {
    topic: "Н и НН",
    q: "В каком слове пишется НН?",
    opts: ["ветре…ый день", "кожа…ый ремень", "стекля…ый шар", "серебря…ое кольцо"],
    a: 2,
    hint: "Вспомни исключения среди прилагательных на -ян-, -ан-, -ин-.",
    why: "«Стеклянный» — исключение, в нём пишется НН. «Ветреный», «кожаный» и «серебряный» пишутся с одной Н."
  },
  {
    topic: "Приставки ПРЕ- и ПРИ-",
    q: "В каком слове приставка ПРЕ- имеет значение, близкое к слову «очень»?",
    opts: [
      "пр…бывать на станции",
      "пр…клонить ветку",
      "пр…интересный рассказ",
      "пр…шить пуговицу"
    ],
    a: 2,
    hint: "Попробуй заменить приставку словом «очень».",
    why: "«Преинтересный» означает «очень интересный», поэтому пишется пре-. Прибывать, приклонить и пришить имеют другие значения."
  },
  {
    topic: "Разделительные Ъ и Ь",
    q: "В каком слове нужен разделительный твёрдый знак?",
    opts: ["с…ёмка", "обез…яна", "в…юга", "птич…и"],
    a: 0,
    hint: "Твёрдый знак обычно пишется после приставки на согласную перед е, ё, ю, я.",
    why: "«Съёмка»: после приставки с- перед ё пишется разделительный ъ. В словах «обезьяна» и «вьюга» нужен ь."
  },
  {
    topic: "О/Ё после шипящих",
    q: "В каком слове после шипящей под ударением пишется Ё?",
    opts: ["ш…рох", "крыж…вник", "печ…нка", "ш…в"],
    a: 2,
    hint: "Вспомни проверку гласной после шипящей в корне однокоренным словом с Е.",
    why: "«Печёнка» связана со словом «печень», поэтому пишется ё. «Шорох», «крыжовник» и «шов» пишутся с о."
  },
  {
    topic: "НЕ с разными частями речи",
    q: "В каком предложении НЕ со словом пишется раздельно?",
    opts: [
      "Это была нелёгкая задача.",
      "Он поступил не по-товарищески.",
      "В комнате было не уютно, а холодно.",
      "Мы увидели небольшой домик."
    ],
    a: 2,
    hint: "Найди противопоставление с союзом «а», которое отрицает один признак и утверждает другой.",
    why: "«Не уютно, а холодно» — противопоставление с союзом «а», поэтому НЕ пишется раздельно."
  },
  {
    topic: "Производные предлоги",
    q: "Выбери правильное написание: «Он выполнил работу (…) часа».",
    opts: ["в течение", "втечение", "в течении", "втечении"],
    a: 0,
    hint: "Речь идёт о времени. Сравни с сочетанием «в течении реки».",
    why: "«В течение часа» — производный предлог со значением времени, пишется раздельно и оканчивается на -е."
  }
];

let index = 0;
let answers = Array(questions.length).fill(null);
let hints = Array(questions.length).fill(false);

const $ = id => document.getElementById(id);

function render() {
  const q = questions[index];
  $("topic").textContent = q.topic;
  $("number").textContent = String(index + 1).padStart(2, "0") + " / 10";
  $("question").textContent = q.q;
  $("options").innerHTML = "";
  $("feedback").className = "feedback";
  $("feedback").textContent = "";

  $("hintText").textContent = q.hint;
  $("hintText").classList.toggle("show", hints[index]);
  $("hintButton").textContent = hints[index]
    ? "− Скрыть подсказку"
    : "＋ Показать подсказку";

  q.opts.forEach((text, i) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "option";

    const letter = document.createElement("span");
    letter.className = "letter";
    letter.textContent = String.fromCharCode(65 + i);

    const label = document.createElement("span");
    label.textContent = text;

    button.append(letter, label);

    if (answers[index] !== null) {
      button.disabled = true;
      if (i === q.a) button.classList.add("correct");
      if (i === answers[index] && i !== q.a) {
        button.classList.add("wrong");
      }
    } else {
      button.addEventListener("click", () => choose(i));
    }

    $("options").appendChild(button);
  });

  $("next").disabled = answers[index] === null;
  $("next").textContent = index === questions.length - 1
    ? "Посмотреть результат →"
    : "Следующий вопрос →";

  const count = answers.filter(a => a !== null).length;
  $("progressText").textContent = `Вопрос ${index + 1} из ${questions.length}`;
  $("answeredText").textContent = `Отвечено: ${count}/${questions.length}`;
  $("progressFill").style.width = count / questions.length * 100 + "%";

  if (answers[index] !== null) showFeedback();
}

function choose(i) {
  if (answers[index] !== null) return;
  answers[index] = i;
  render();
}

function showFeedback() {
  const q = questions[index];
  const correct = answers[index] === q.a;
  const box = $("feedback");

  box.className = "feedback show " + (correct ? "good" : "bad");

  const title = document.createElement("strong");
  title.textContent = correct
    ? "Верно! Отличная работа."
    : "Не совсем. Запомни правило.";

  const explanation = document.createElement("div");
  explanation.textContent = q.why;

  box.append(title, explanation);
}

$("hintButton").addEventListener("click", () => {
  hints[index] = !hints[index];
  render();
});

$("next").addEventListener("click", () => {
  if (answers[index] === null) return;

  if (index < questions.length - 1) {
    index++;
    render();
  } else {
    finish();
  }
});

function finish() {
  const score = answers.reduce(
    (sum, answer, i) => sum + (answer === questions[i].a ? 1 : 0),
    0
  );

  $("quiz").style.display = "none";
  $("result").classList.add("show");
  $("progressBox").style.display = "none";
  $("score").textContent = score + " / 10";

  $("resultTitle").textContent =
    score === 10 ? "Превосходно!" :
    score >= 7 ? "Хороший результат!" :
    score >= 5 ? "Есть хорошая база!" :
    "Продолжай тренироваться!";

  $("resultText").textContent =
    `Правильных ответов: ${score} из 10. Ниже — разбор вопросов и правила для повторения.`;

  $("review").innerHTML = "";

  questions.forEach((q, i) => {
    const item = document.createElement("div");
    item.className = "review-item";

    const title = document.createElement("strong");
    title.textContent =
      (answers[i] === q.a ? "✓ " : "↻ ") + (i + 1) + ". " + q.q;

    const answer = document.createElement("div");
    answer.textContent = "Правильный ответ: " + q.opts[q.a];

    const explanation = document.createElement("p");
    explanation.className = "muted";
    explanation.textContent = q.why;

    item.append(title, answer, explanation);
    $("review").appendChild(item);
  });

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function restart() {
  index = 0;
  answers = Array(questions.length).fill(null);
  hints = Array(questions.length).fill(false);

  $("quiz").style.display = "block";
  $("result").classList.remove("show");
  $("progressBox").style.display = "block";

  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

$("restart").addEventListener("click", restart);
$("again").addEventListener("click", restart);

render();
</script>
</body>
</html>
